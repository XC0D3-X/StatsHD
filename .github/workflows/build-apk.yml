name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.4-beta.apk
          ls -lh StatHD-v1.4-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.4-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-beta
          name: "StatHD v1.4-beta — Clean Vector UI, Video Timeline & Before/After Split Preview"
          body: |
            ### StatHD v1.4-beta (Pre-Release Testing Build)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### New in v1.4-beta:
            - **Zero-Scroll Clean Native UI:** Replaced the old vertical scroll layout with a single-screen video editor layout, top Hamburger Settings drawer, Target Quality popup, and bottom-right `+` Floating Action Button.
            - **100% Vector Icons (`res/drawable/ic_*.xml`):** Replaced all keyboard symbols/emojis with crisp Android VectorDrawables.
            - **Interactive Video Timeline & Trim Controller:** Play/Pause, live timeline scrubber (`0:00 / 0:20`), and highlight clip trim slider.
            - **Live Before / After & Split-Screen Comparison:** Switch between **Original**, **Split** (draggable pixel-accurate frame comparison), and **Enhanced** directly inside the app before sharing to WhatsApp Status.
            - **Dual-Radius Wink GPU Shader (`3x3` + `7x7` Clarity):** Calibrated on portrait gameplay to survive WhatsApp's internal H.264 compression.

            **Direct Beta APK Download:**
            Tap **`StatHD-v1.4-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.4-beta.apk
          draft: false
          prerelease: true
