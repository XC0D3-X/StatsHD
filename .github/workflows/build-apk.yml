name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.4.8-beta.apk
          ls -lh StatHD-v1.4.8-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.4.8-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.8-beta
          name: "StatHD v1.4.8-beta — Native 1:1 Pixel Preservation (Up to 2200px) + H.264 High Profile CABAC"
          body: |
            ### StatHD v1.4.8-beta (Razor-Sharp Native 1:1 Text & H.264 High Profile Build)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### Fixed in v1.4.8-beta:
            - **Zero Fractional Bilinear Downscale Blur (`2200px` Native Cap):** Phone screen recordings like `1220x2168` now preserve **1:1 native pixels** instead of being bilinearly shrunk from `1220x2168` ➔ `1080x1920`, keeping fine usernames (`Syamir 969`) and numbers razor-sharp!
            - **Forced H.264 High Profile (`AVCProfileHigh` / `Level 4.2` — CABAC + 8x8 DCT):** Replaces Android's default soft Baseline Profile with High Profile (with automatic fallback for older devices).
            - **5.6 Mbps / 13.4 MB Safe Ceiling:** Maximizes crispness while staying strictly under Meta WhatsApp Cloud API's `16.0 MB` limit.

            **Direct Beta APK Download:**
            Tap **`StatHD-v1.4.8-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.4.8-beta.apk
          draft: false
          prerelease: true
