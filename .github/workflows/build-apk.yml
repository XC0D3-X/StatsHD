name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.4.7-beta.apk
          ls -lh StatHD-v1.4.7-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.4.7-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.7-beta
          name: "StatHD v1.4.7-beta — Fix Hardware VBR Overshoot (< 16 MB WhatsApp Cloud API Safe Ceiling)"
          body: |
            ### StatHD v1.4.7-beta (Safe <16 MB Cloud API Ceiling Hotfix)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### Fixed in v1.4.7-beta:
            - **Fixed Hardware VBR Overshoot (`> 16 MB` Error):** Added a safety margin to `1080p FHD` (`12.8 MB` target / `5.2 Mbps` cap) so even when Android's hardware VBR encoder overshoots by 10–15% on fast gaming footage, the final MP4 stays strictly below Meta WhatsApp Cloud API's `16.0 MB` hard limit!

            **Direct Beta APK Download:**
            Tap **`StatHD-v1.4.7-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.4.7-beta.apk
          draft: false
          prerelease: true
