name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.2.0-beta.apk
          ls -lh StatHD-v1.2.0-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.2.0-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-beta
          name: "StatHD v1.2.0-beta (Pre-Release Testing Build)"
          body: |
            ### 🧪 StatHD v1.2.0-beta (Pre-Release Testing Build)
            > **Note:** This is an active **Beta / Pre-Release** build for testing WhatsApp Status bypass quality before final stable release.

            #### What's Being Tested in v1.2.0-beta:
            - **100% Lossless Bit-for-Bit Stream Copy (`MediaExtractor` + `MediaMuxer`):** Cuts 30s/45s clips with **ZERO re-encoding** when source video is `<= 1280px` (0% pixel loss from original).
            - **1.0s Keyframe H.264 High-Clarity Encoding:** Locks a 1-second I-frame interval (`setiFrameIntervalSeconds(1.0f)`) for fast gaming motion recovery.
            - **Gamer Full-Screen Mode (`Rotate 90° Vertical`):** Rotates landscape gameplay 90° (`576x1280` / `720x1280`) to fill 100% of WhatsApp Status's vertical display.

            📲 **Direct Beta APK Download:**
            Tap **`StatHD-v1.2.0-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.2.0-beta.apk
          draft: false
          prerelease: true
