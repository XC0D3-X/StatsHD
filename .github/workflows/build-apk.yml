name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.3.0-beta.apk
          ls -lh StatHD-v1.3.0-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.3.0-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-beta
          name: "StatHD v1.3.0-beta — Wink GPU Ultra-HD Restoration Engine (Pre-Release)"
          body: |
            ### 🧪 StatHD v1.3.0-beta (Wink GPU Quality Restoration Build)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### New in v1.3.0-beta:
            - **✨ Wink GPU Ultra-HD Restoration Shader (`WinkUltraHdEffect.kt`):** Real-time 9-tap OpenGL ES 2.0 GPU fragment shader combining:
              1. **Edge-Preserving Bilateral De-Blocking & Mosquito Noise Removal:** Smooths flat compression blocks on grass/sky/skin without blurring borders.
              2. **Contrast-Adaptive Sharpening (CAS) with Anti-Halo Clamp:** Reconstructs crisp text, hero HP bars, outlines, and fine details without white ringing.
              3. **Shadow-Safe Vibrance Pop:** Boosts muted colors smoothly while preserving natural dark shadow visibility.
            - **🔥 Wink MAX Game/Anime Clarifier Toggle:** Extra detail pop mode for gaming and anime clips.

            📲 **Direct Beta APK Download:**
            Tap **`StatHD-v1.3.0-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.3.0-beta.apk
          draft: false
          prerelease: true
