name: Build StatHD Android APK (Standalone)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.2.0.apk
          ls -lh StatHD-v1.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-APK
          path: StatHD-v1.2.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stathd-v1.2.0
          name: "StatHD v1.2.0 — 100% Lossless Stream Copy + Gamer 90° Full-Screen Mode"
          body: |
            ### StatHD v1.2.0 (PureStatus Engine for Android)
            - **100% Lossless Bit-for-Bit Stream Copy (`MediaExtractor` + `MediaMuxer`):** When your source video is already `<= 1280px` (e.g. `1280x576`), StatHD cuts 30s/45s clips with **ZERO re-encoding** (0% pixel loss — 100% identical graphic to the original video!).
            - **1.0s Keyframe H.264 High-Clarity Encoding:** For 4K/1080p downscaling, locks a 1-second I-frame interval (`setiFrameIntervalSeconds(1.0f)`) so fast gaming teamfights recover sharpness immediately.
            - **Gamer Full-Screen Mode (`Rotate 90° Vertical`):** Optional toggle to rotate landscape gameplay 90° (`576x1280` / `720x1280`) so it fills 100% of WhatsApp Status's vertical screen (2.5x more pixels than horizontal view!).

            📲 **Direct APK Download for Android:**
            Tap **`StatHD-v1.2.0.apk`** under **Assets** below to download and install directly on your Android device.
          files: StatHD-v1.2.0.apk
          draft: false
          prerelease: false
