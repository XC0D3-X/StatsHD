name: Build StatHD Android APK (Stable Release)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Stable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Stable Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Stable APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.5.0.apk
          ls -lh StatHD-v1.5.0.apk

      - name: Upload Stable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-v1.5.0-Stable-APK
          path: StatHD-v1.5.0.apk
          if-no-files-found: error

      - name: Publish Official Stable Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "StatHD v1.5.0 — Official Stable Release"
          body: |
            ### StatHD v1.5.0 — Official Stable Release (Android)

            **StatHD** is a 100% free, ad-free, watermark-free open-source Android app engineered to upload crystal-clear **True 1080p HD** videos and photos to **WhatsApp Status**.

            #### Highlights in v1.5.0:
            - **Native 1:1 Pixel Preservation (Up to `2200px`) + H.264 High Profile (CABAC):** Eliminates fractional bilinear downscale blur on phone recordings (`1220x2168`) and forces `AVCProfileHigh` with 1-second keyframes for razor-sharp text & motion.
            - **100% Lossless Bit-for-Bit Stream Copy:** Automatically copies video packets directly with zero re-encoding whenever source clips already fit size limits.
            - **Built-In WhatsApp Cloud API Bot Delivery (True 1080p Bypass):** Streams untouched `1080p` MP4s (`< 16 MB`) via Cloudflare Worker directly to your WhatsApp chat for zero-compression forwarding to Status — featuring a **Telegram-style International Country Code Selector** for users worldwide.
            - **Clean Zero-Scroll Native UI & 100% Vector Icons:** Single-screen video editor with Play/Pause timeline scrubber, clip trim slider, Hamburger Settings drawer, Target Quality dialog, and bottom-right `+` FAB.
            - **Live Before / After & Draggable 50/50 Split-Screen Comparison:** Inspect **Original**, **Split**, and **Enhanced** frames directly inside the app before sharing.
            - **HD Photo Optimizer:** Unified `+` picker & Gallery Share sheet supports **both Videos and Photos** with EXIF auto-fix and JPEG Q92 export.
            - **Optional Wink GPU Shader & Gamer 90° Mode:** Optional Dual-Radius (`3x3` + `7x7`) OpenGL ES 2.0 sharpening shader and 90° vertical full-screen rotation for landscape games.

            **Direct APK Download for Android:**
            Tap **`StatHD-v1.5.0.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.5.0.apk
          draft: false
          prerelease: false
