name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.4.4-beta.apk
          ls -lh StatHD-v1.4.4-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.4.4-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.4-beta
          name: "StatHD v1.4.4-beta — Fix Export Crash + 1080p Full Performance & True HD Guide"
          body: |
            ### StatHD v1.4.4-beta (Hotfix Pre-Release)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### Fixed in v1.4.4-beta:
            - **Fixed Immediate Crash on Export:** Removed conflicting `experimentalSetEnableHighQualityTargeting(true)` flag that caused Media3 `VideoEncoderSettings.Builder.build()` to throw `IllegalStateException` when combined with `setBitrate(...)`.
            - Preserves full dynamic bitrate budget (`1080p Max 15MB` up to 16 Mbps & `720p Max 11MB` up to 12 Mbps), **HD Photo Optimizer**, and **Step-by-Step True HD Guide** inside Hamburger Menu & Export Popup.

            **Direct Beta APK Download:**
            Tap **`StatHD-v1.4.4-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.4.4-beta.apk
          draft: false
          prerelease: true
