name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.4.0-beta.apk
          ls -lh StatHD-v1.4.0-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.4.0-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-beta
          name: "StatHD v1.4.0-beta — Dual-Radius Wink Unsharp (3x3 + 7x7 Clarity) Build"
          body: |
            ### 🧪 StatHD v1.4.0-beta (Calibrated on Portrait Gameplay Master)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### What's Fixed & Upgraded in v1.4.0-beta:
            - **Removed Self-Canceling Bilateral Blur:** Preserves 100% raw center pixel sharpness (`c`) before applying dual-scale unsharp reconstruction.
            - **Dual-Radius Multi-Scale Unsharp + 3D Clarity Shader (`WinkUltraHdEffect.kt`):**
              1. **Scale 1 (`3x3` Fine Kernel • `1.0px` radius • `1.65x` strength):** Sharpens fine text, player names, damage numbers, and HP bar tick lines.
              2. **Scale 2 (`7x7` Wide Clarity Kernel • `2.5px` radius • `1.15x` strength):** Reconstructs zoomed-in game edges, hero armor, bush leaves, and skill rings so edge coefficients survive WhatsApp's internal H.264 quantization.
              3. **Unlocked Dynamic Range (`±0.24` vs previous `±0.025`):** 9.6x higher sharpening headroom with `1.06x` micro-contrast and `1.12x` vibrance pop.

            📲 **Direct Beta APK Download:**
            Tap **`StatHD-v1.4.0-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.4.0-beta.apk
          draft: false
          prerelease: true
