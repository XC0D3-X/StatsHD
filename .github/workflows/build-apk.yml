name: Build StatHD Android APK (Beta)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile StatHD Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Beta APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Beta APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk StatHD-v1.4.5-beta.apk
          ls -lh StatHD-v1.4.5-beta.apk

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatHD-WhatsApp-Status-HD-Beta-APK
          path: StatHD-v1.4.5-beta.apk
          if-no-files-found: error

      - name: Publish Pre-Release Beta APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.5-beta
          name: "StatHD v1.4.5-beta — Free WhatsApp Cloud API Bot Delivery (True 1080p Bypass)"
          body: |
            ### StatHD v1.4.5-beta (True 1080p WhatsApp Cloud API Bot Build)
            > **Note:** Active **Beta / Pre-Release** build (`prerelease: true`).

            #### New in v1.4.5-beta:
            - **Send via HD Bot (True 1080p Bypass):** Streams your untouched `1080p` MP4 (up to `16 MB`) directly through your free **Cloudflare Worker (`stathd-bot`)** to **Meta WhatsApp Cloud API**, completely bypassing WhatsApp Android's `720p` / `3.9 MB` local compressor!
            - **WhatsApp HD Bot Setup Dialog** inside Hamburger Menu (`☰`) with 1-tap **"Step 1: Open Bot Chat & Say Hi"** to activate the free 24-hour Meta Service Window.
            - Includes full `stathd-bot/` Cloudflare Worker source code in the repository.

            **Direct Beta APK Download:**
            Tap **`StatHD-v1.4.5-beta.apk`** under **Assets** below to install on your Android device.
          files: StatHD-v1.4.5-beta.apk
          draft: false
          prerelease: true
